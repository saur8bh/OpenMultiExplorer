<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="omeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="omeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Cloud Gradient Primary -->
    <linearGradient id="omeCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Folder Gradient -->
    <linearGradient id="omeFolder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Folder Front Flap -->
    <linearGradient id="omeFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="omeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#omeBg)" stroke="url(#omeBorder)" stroke-width="2.5" />

  <!-- Multi-Cloud Orbital Sync Rings -->
  <path d="M 28 44 A 42 42 0 0 1 100 44" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.6" />
  <path d="M 100 84 A 42 42 0 0 1 28 84" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Satellite Cloud Nodes -->
  <circle cx="28" cy="44" r="5" fill="#38bdf8" filter="url(#omeGlow)" />
  <circle cx="100" cy="44" r="5" fill="#818cf8" filter="url(#omeGlow)" />
  <circle cx="100" cy="84" r="4.5" fill="#38bdf8" />
  <circle cx="28" cy="84" r="4.5" fill="#34d399" />

  <!-- Main Multi-Cloud Shape -->
  <path d="M 44 48 A 14 14 0 0 1 68 40 A 18 18 0 0 1 92 48 A 12 12 0 0 1 92 70 L 40 70 A 12 12 0 0 1 44 48 Z" fill="url(#omeCloud)" opacity="0.9" />

  <!-- Dual-Pane Explorer Folder in Foreground -->
  <path d="M 36 56 L 52 56 L 58 62 L 92 62 C 95 62 97 64 97 67 L 97 74 L 31 74 L 31 61 C 31 58 33 56 36 56 Z" fill="url(#omeFolder)" />
  
  <!-- Folder Front Body -->
  <path d="M 31 71 C 31 68 33 66 36 66 L 92 66 C 95 66 97 68 97 71 L 95 94 C 95 97 93 99 90 99 L 38 99 C 35 99 33 97 33 94 Z" fill="url(#omeFront)" />

  <!-- Central AES-256 Vault / Multi-Transfer Arrow Glyph inside Folder -->
  <g transform="translate(64, 82)">
    <path d="M 0 -8 L 8 -4 L 8 2 C 8 7 4 10 0 12 C -4 10 -8 7 -8 2 L -8 -4 Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.6" />
    <path d="M -3 1 L -1 3 L 4 -2" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
